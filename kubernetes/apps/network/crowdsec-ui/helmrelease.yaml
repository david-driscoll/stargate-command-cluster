---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app crowdsec-ui
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  driftDetection:
    mode: enabled
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    fullnameOverride: *app
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        initContainers:
          # The crowdsec chart replaces the upstream entrypoint with
          # files/docker-start-custom.sh, which has no AGENT_USERNAME /
          # AGENT_PASSWORD passthrough, so the LAPI cannot pre-register this
          # watcher for us. Register it here against the LAPI's
          # auto_registration endpoint instead (POST /v1/watchers, enabled in
          # crowdsec/values.yaml with allowed_ranges covering the pod CIDR).
          #
          # Deliberately non-fatal. A watcher that already exists is refused,
          # which is the steady state on every restart, and a transient LAPI
          # blip must not crash-loop the UI. A genuine failure surfaces as a
          # LAPI auth error in the UI and in this container's log.
          register-watcher:
            image:
              repository: curlimages/curl
              tag: 8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13
              pullPolicy: IfNotPresent
            env:
              LAPI_URL: http://crowdsec-service.network.svc.cluster.local:8080
              MACHINE_ID: crowdsec-web-ui
              MACHINE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: ${APP}-env
                    key: CONFIG_INSTANCE_LAPI_AUTH_PASSWORD
              REGISTRATION_TOKEN:
                valueFrom:
                  secretKeyRef:
                    # Generated by the crowdsec chart, same namespace. The chart
                    # preserves it across upgrades via a `lookup`, so this is
                    # stable.
                    name: crowdsec-lapi-secrets
                    key: registrationToken
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -u
                printf '{"machine_id":"%s","password":"%s","registration_token":"%s"}' \
                  "$MACHINE_ID" "$MACHINE_PASSWORD" "$REGISTRATION_TOKEN" > /tmp/reg.json
                code=$(curl -sS -o /tmp/reg.out -w '%{http_code}' \
                  -X POST "$LAPI_URL/v1/watchers" \
                  -H 'Content-Type: application/json' \
                  --data @/tmp/reg.json) || code=000
                case "$code" in
                  201|202) echo "registered watcher $MACHINE_ID" ;;
                  403) echo "watcher $MACHINE_ID already registered, continuing" ;;
                  *) echo "watcher registration returned HTTP $code:"; cat /tmp/reg.out; echo;
                     echo "continuing -- the UI will report a LAPI auth error if this mattered" ;;
                esac
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
        containers:
          *app :
            image:
              repository: ghcr.io/theduffman85/crowdsec-web-ui
              # PINNED BY DIGEST, not by tag alone. This project is ~8 months
              # old, single-maintainer, and ships multiple releases per week;
              # a floating tag would mean unreviewed code in a console that can
              # issue and revoke bans. Renovate proposes bumps.
              tag: 2026.8.1@sha256:efd325713704b1408d90bd682ec304d2758328cee28905f08f0792e043d81b4a
              pullPolicy: IfNotPresent
            envFrom:
              - secretRef:
                  name: ${APP}-env
            resources:
              requests:
                cpu: 50m
                memory: 192Mi
              limits:
                memory: 768Mi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # Public by design and does not wait on the LAPI: bootstrap
                    # retries in the background, so the container is healthy
                    # before the first sync completes.
                    path: /api/health
                    port: &port 3000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              allowPrivilegeEscalation: false
              # SQLite (with WAL) and the GeoNames snapshot both write.
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      securityContext:
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }

    persistence:
      data:
        existingClaim: ${APP}
        advancedMounts:
          *app :
            *app :
              - path: /app/data
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp

    service:
      *app :
        controller: *app
        type: ClusterIP
        ports:
          http:
            port: *port
            targetPort: *port

    route:
      # Internal Gateway only. This console can issue and revoke bans -- it must
      # never appear on the external Gateway. Tailscale access comes from the
      # components/tailscale Ingress in ks.yaml.
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "${APP}.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: *app
                port: *port
            filters:
              # local-user = error-pages + internal-network. The app does its
              # own OIDC against Authentik (native, no forward-auth), so the
              # outpost chain is not used here; this just keeps the route off
              # anything that is not on the internal network.
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: local-user

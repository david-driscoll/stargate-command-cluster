---
# yaml-language-server: $schema=https://raw.githubusercontent.com/cloudnative-pg/charts/refs/heads/main/charts/cluster/values.schema.json
nameOverride: &name "postgres"
fullnameOverride: *name
type: postgresql
version:
  postgresql: "17.5"
mode: standalone
recovery:
  method: object_store
  clusterName: "restore"
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    # The bucket name comes from cluster-secrets, where BACKBLAZE-underscore-DB
    # -underscore-BUCKET is "stargate-command-db" — so this renders exactly what
    # the 1Password extract produced. The endpoint above has been TrueNAS Minio
    # for a while; only the bucket NAME still came from the Backblaze item,
    # which is the mismatch vault#119 warned about.
    #
    # The variable is named in words rather than written out, because Flux
    # postBuild envsubst expands substitutions inside COMMENTS too: spelling it
    # normally here would bake the live value into the ConfigMap.
    bucket: "${BACKBLAZE_DB_BUCKET}-restore"
    path: "/"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
backups:
  enabled: true
  # `plugin` routes backups through plugin-barman-cloud (already deployed at
  # v0.7.1) rather than the operator's in-core barmanObjectStore, which is
  # deprecated upstream and slated for removal. This renders an
  # ObjectStore/postgres-backups and attaches the plugin to the Cluster as the
  # WAL archiver, which is what gives us continuous archiving and PITR.
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  endpointURL: "{{ .minio_endpoint }}"
  provider: s3
  s3:
    region: "{{ .minio_region }}"
    # A Minio bucket, because the endpoint URL, access key and secret key
    # around it are all Minio-on-truenas. What stood here until vault#119 was
    # a templated reference to the backblaze item's bucket field, which names
    # a bucket that exists only on Backblaze B2 -- so every WAL archive died
    # with NoSuchBucket, reported as barman's opaque "exit status 4". Do not
    # reintroduce a backblaze-prefixed reference here: the two 1Password items
    # this file is templated from are told apart only by that prefix, and
    # nothing downstream will catch the mismatch. The bucket is provisioned in
    # home-operations stacks/home and must exist before this reconciles,
    # because barman-cloud does not create buckets.
    bucket: "cnpg-${CLUSTER_CNAME}"
    # Dedicated prefix so barman's base backups + WAL never share a namespace
    # with the logical dumps or the `-restore` staging bucket.
    path: "/barman/${CLUSTER_CNAME}"
    accessKey: "{{ .minio_username }}"
    secretKey: "{{ .minio_password }}"
  wal:
    compression: gzip
    encryption: ''
    maxParallel: 4
  data:
    compression: gzip
    encryption: ''
    jobs: 2
  scheduledBackups:
  - name: daily-backup
    schedule: "${POSTGRES_BACKUP_SCHEDULE:=0 0 16 * * *}"
    backupOwnerReference: self
    method: plugin
    pluginConfiguration:
      name: barman-cloud.cloudnative-pg.io
  retentionPolicy: "30d"
cluster:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  priorityClassName: system-node-critical
  storage:
    size: ${POSTGRES_STORAGE:=10Gi}
    storageClass: longhorn
  resources:
    requests:
      cpu: ${POSTGRES_REQUESTS_CPU}
      memory: ${POSTGRES_REQUESTS_MEMORY}
    limits:
      memory: ${POSTGRES_LIMITS_MEMORY}
  logLevel: "info"
  probes:
    liveness:
      isolationCheck:
        enabled: true
        connectionTimeout: 5000
        requestTimeout: 5000
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: preferred
    topologyKey: kubernetes.io/hostname
  enableSuperuserAccess: true
  superuserSecret: "postgres-superuser-password"
  roles:
  - name: ${CLUSTER_CNAME}
    ensure: present
    login: true
    superuser: true
    passwordSecret:
      name: postgres-user-password
  - name: authentik
    ensure: present
    login: true
    superuser: false
    passwordSecret:
      name: authentik-postgres-password
  monitoring:
    enabled: true
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
      excludeRules:
      - CNPGClusterLogicalReplicationErrorsCritical
      - CNPGClusterLogicalReplicationErrors
      - CNPGClusterLogicalReplicationStoppedCritical
      - CNPGClusterLogicalReplicationStopped
    disableDefaultQueries: false
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: "${POSTGRES_SHARED_BUFFERS}"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: all
      wal_keep_size: "1GB"
      max_slot_wal_keep_size: "20GB"
      wal_sender_timeout: "120s"
      wal_receiver_timeout: "120s"
      tcp_keepalives_idle: "10"
      tcp_keepalives_interval: "10"
      tcp_keepalives_count: "3"
    pg_hba: []
    pg_ident: []
    shared_preload_libraries: []
    ldap: {}
  serviceAccountTemplate: {}
  additionalLabels: {}
  annotations: {}
imageCatalog:
  create: true
  images: []
poolers: []

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app authentik
spec:
  chart:
    spec:
      chart: authentik
      version: 2026.5.6
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: authentik
        namespace: flux-system
  maxHistory: 3
  interval: 1h
  timeout: 20m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 12
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 12
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:

    global:
      priorityClassName: system-node-critical
      # fullnameOverride: authentik
      revisionHistoryLimit: 3

      # Deployment strategy for zero-downtime updates
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0

      deploymentAnnotations:
        reloader.stakater.com/auto: "true"

      podAnnotations:
        reloader.stakater.com/auto: "true"

      secretAnnotations:
        reloader.stakater.com/auto: "true"

      securityContext:
        runAsUser: 568
        runAsGroup: 568
        runAsNonRoot: true
        fsGroup: 568
        fsGroupChangePolicy: "OnRootMismatch"
      envFrom: &envFrom
        - secretRef:
            name: authentik
        - secretRef:
            name: authentik-bootstrap
        - secretRef:
            name: authentik-postgres

      volumeMounts:
        - mountPath: /media
          name: media
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: *app

    authentik:
      enabled: true
      log_level: trace
      # events:
      #   context_processors:
      #     # -- Path for the GeoIP City database. If the file doesn't exist, GeoIP features are disabled.
      #     geoip: /geoip/GeoLite2-City.mmdb
      #     # -- Path for the GeoIP ASN database. If the file doesn't exist, GeoIP features are disabled.
      #     asn: /geoip/GeoLite2-ASN.mmdb
      error_reporting:
        enabled: false
        environment: "${CLUSTER_CNAME}"
        send_pii: false
    blueprints:
      configMaps: []
      secrets: []
    server:
      enabled: true
      name: server
      replicas: 2

      tolerations: &tolerations []

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: *app
                app.kubernetes.io/component: server

      resources: &resources
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          # cpu: 1
          memory: 1Gi

      # Health probes for better restart recovery
      livenessProbe:
        failureThreshold: 5
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        httpGet:
          path: "/-/health/live/"
          port: http

      readinessProbe:
        failureThreshold: 5
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        httpGet:
          path: "/-/health/ready/"
          port: http

      startupProbe:
        failureThreshold: 3
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        httpGet:
          path: "/-/health/live/"
          port: http

      # Graceful shutdown period
      terminationGracePeriodSeconds: 60

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      route:
        main:
          enabled: true
          apiVersion: gateway.networking.k8s.io/v1
          kind: HTTPRoute
          # CUTOVER, step 5 of docs/cluster-consolidation/07-authentik-to-alpha-site.md
          # in the home-operations repo: authentik has moved to alpha-site, and
          # this route releases the three vanity names so external-dns retracts
          # them and alpha-site can claim them.
          #
          # This is the release half of a two-part change and MUST land first.
          # All three names are external-dns-published from this HTTPRoute across
          # THREE providers (cloudflare, technitium, unifi), so as long as they are
          # listed here external-dns keeps re-asserting them at SGC's gateway and
          # wins against anything alpha-site publishes.
          #
          # The workload below is deliberately left running and untouched. This
          # removes the NAMES, not the server — which is also what makes the
          # rollback "put these three lines back", not "scale something up".
          #
          # authentik.${CLUSTER_DOMAIN} keeps this instance directly reachable
          # during the soak, for comparing against alpha-site without going
          # through the names that now point there. Same pattern alpha-site used
          # while IT was the staging copy, in reverse.
          hostnames:
            - "authentik.${CLUSTER_DOMAIN}"
          parentRefs:
            - name: internal
              namespace: network
              kind: Gateway
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: authentik-cors

    worker:
      enabled: true
      replicas: 1
      envFrom: *envFrom
      tolerations: *tolerations
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: *app
                app.kubernetes.io/component: worker
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          # cpu: 2
          memory: 2Gi

      # Health probes for better restart recovery
      livenessProbe:
        failureThreshold: 5
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        exec:
          command:
            - ak
            - healthcheck

      readinessProbe:
        failureThreshold: 5
        initialDelaySeconds: 15
        periodSeconds: 10
        timeoutSeconds: 5
        exec:
          command:
            - ak
            - healthcheck

      startupProbe:
        failureThreshold: 3
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10
        exec:
          command:
            - ak
            - healthcheck

      # Graceful shutdown period
      terminationGracePeriodSeconds: 60

    serviceAccount:
      *app : {}

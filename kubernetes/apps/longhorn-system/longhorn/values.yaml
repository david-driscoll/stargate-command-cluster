---

# The dollars below are DOUBLED, which is the escape. configMapGenerator
# slurps this file whole and Flux postBuild envsubst then runs over the built
# output, comments included -- unescaped, this commented-out example put the
# real Spike IP and cluster name into the deployed ConfigMap. Halve them again
# when uncommenting.
# defaultBackupStore:
#   backupTarget: nfs://$${SPIKE_IP}:/mnt/stash/backup/$${CLUSTER_CNAME}/longhorn
  # backupTargetCredentialSecret: s3-secret
preUpgradeChecker:
  upgradeVersionCheck: false
persistence:
  defaultDataLocality: best-effort
defaultSettings:
  createDefaultDiskLabeledNodes: false
  defaultDataLocality: best-effort
  defaultLonghornStaticStorageClass: longhorn
  defaultReplicaCount: 2
  guaranteedInstanceManagerCpu: 5
  nodeDownPoddeletionPolicy: Delete-both-statefulset-and-deployment-pod
  volumeAttachmentRecoveryPolicy: never
  # Chart key is orphanResourceAutoDeletion (chart 1.12.0) and the value is a
  # SEMICOLON-separated list of resource types, not a boolean. The old
  # `orphanAutoDeletion: true` matched no key in the chart, so it was dropped
  # silently and orphan-resource-auto-deletion has been empty -- nothing was
  # ever cleaned up. Valid items: `instance` (engine and replica runtime
  # instances) and `replica-data` (replica data directories on disk).
  #
  # Only `instance` is enabled. Every orphan on both clusters is an
  # engine-instance left behind by the VolSync movers, and those are what drive
  # the respawn loop on milky-way. `replica-data` deletes actual replica data
  # directories and has never been active on this estate, so turning it on is a
  # separate, deliberate decision -- not a side effect of this fix. See vault#123.
  orphanResourceAutoDeletion: instance
  orphanResourceAutoDeletionGracePeriod: 300
  replicaAutoBalance: best-effort
  storageMinimalAvailablePercentage: 5
  storageReservedPercentageForDefaultDisk: 10
  autoCleanupSnapshotAfterOnDemandBackupCompleted: true
  autoCleanupSnapshotWhenDeleteBackup: true
  autoCleanupSystemGeneratedSnapshot: true
  autoCleanupRecurringJobBackupSnapshot: true
  removeSnapshotsDuringFilesystemTrim: true
  snapshotMaxCount: 5
  snapshotCountWarningThreshold: 4

  # backupTargetCredentialSecret: s3-secret
  defaultDataPath: /var/mnt/longhorn/
  storageOverProvisioningPercentage: 600
  upgradeChecker: true
  priorityClass: system-node-critical
  # taintToleration: key1=value1:NoSchedule; key2:NoExecute
  # systemManagedComponentsNodeSelector: "label-key1:label-value1"
  # disableSchedulingOnCordonedNode: false
  # replicaZoneSoftAntiAffinity: false
  # replicaDiskSoftAntiAffinity: false

  allowEmptyDiskSelectorVolume: true
  # `block-for-eviction-if-contains-last-replica` deadlocks Talos upgrades on any
  # node holding a `longhorn-local` volume. That policy tells Longhorn to REBUILD
  # the last replica on another node before releasing the drain -- but those
  # volumes are `strict-local` with `numberOfReplicas: 1` and hard PV nodeAffinity,
  # so the rebuild can never be scheduled ("hard affinity cannot be satisfied").
  # Longhorn then holds the volume attached forever, keeps the per-node
  # instance-manager PDB at 0 allowed disruptions, and tuppr's drain retries until
  # it times out. Meanwhile the pinned workloads (valkey, postgres-3, technitium)
  # sit Pending because their PV only matches the cordoned node. See vault#TBD.
  #
  # `allow-if-replica-is-stopped` still refuses to drain a node whose last replica
  # is actively RUNNING, but lets the drain through once the workload is gone and
  # the replica has stopped -- which is exactly the upgrade case. Trade-off: if a
  # drained node never comes back, a single-replica volume on it is lost. That is
  # already true for every `longhorn-local` volume by construction.
  nodeDrainPolicy: allow-if-replica-is-stopped
ingress:
  enabled: true
  ingressClassName: internal
  host: "longhorn.${CLUSTER_DOMAIN}"
  annotations:
    reloader.stakater.com/auto: "true"
    external-dns.alpha.kubernetes.io/target: "${INTERNAL_DOMAIN}"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: network-local-user@kubernetescrd
metrics:
  serviceMonitor:
    enabled: true

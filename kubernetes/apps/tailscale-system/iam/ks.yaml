---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tsiam
  namespace: &namespace tailscale-system
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: tailscale-operator
      namespace: tailscale-system
    - name: volsync
      namespace: volsync-system
  path: ./kubernetes/apps/tailscale-system/iam
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../components/failover/fast-node-eviction
    - ../../../components/volsync
    # NOTE: components/volsync-restore was here for the #1739 bootstrap and has
    # now been removed -- its removal obligation is discharged. The RD completed
    # (status.lastManualSync=restore-once, lastSyncTime 2026-08-02T01:16:01Z,
    # "No eligible snapshots found / No data will be restored" -- the intended
    # empty-volume bootstrap path), the PVC is Bound, and the ReplicationSource
    # is backing up. Dropping the component prunes the RD and cascades away the
    # volsync-tsiam-dst-dest / volsync-dst-tsiam-dst-cache pair, which is exactly
    # what the nightly cleanup CronJob would have done at 03:30. Leaving it in
    # would have Flux recreate the RD every reconcile and fight that job -- the
    # permanent -dst-dest/-dst-cache pair caused the 2026-07 Longhorn incident.
    #
    # Re-add it (temporarily, same removal obligation) only if the tsiam PVC ever
    # has to be rebuilt: components/volsync stamps the PVC with a dataSourceRef to
    # a ReplicationDestination that only that component creates, so without it a
    # fresh PVC never binds.
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      # distroless nonroot uid/gid -- must match the pod securityContext so the
      # restic mover restores the signing key with ownership tsiam can read.
      VOLSYNC_PUID: "65532"
      VOLSYNC_PGID: "65532"
      # Named explicitly: this cluster has TWO default StorageClasses (longhorn and
      # openebs-hostpath), so an unqualified PVC can silently land on non-replicated
      # node-local storage. See david-driscoll/vault#113.
      VOLSYNC_STORAGECLASS: longhorn
      # A JWK and a tsnet state dir. Kilobytes, not gigabytes.
      VOLSYNC_CAPACITY: 1Gi
      # Both movers read this. It defaults to 2Gi in the ReplicationSource but
      # 8Gi in the ReplicationDestination, so leaving it unset would provision an
      # 8Gi replicated Longhorn cache volume to restore zero bytes. Restic only
      # caches index/metadata here, and the payload is a JWK plus tsnet state.
      VOLSYNC_CACHE_CAPACITY: 1Gi

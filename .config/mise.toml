[tools]
python = "3.14.7"
"pipx:makejinja" = "2.8.2"
krew = "0.5.0"

kubectl = "1.36.4"
powershell-core = "7.6.5"
1password-cli = "2.38.1"
talos = "1.13.9"
talosctl = "1.13.9"
talhelper = "3.1.17"
yq = "4.53.6"
jq = "1.8.2"
helm = "4.2.4"
helmfile = "1.7.4"
kubeconform = "0.8.0"
kustomize = "5.8.1"
task = "3.52.0"
# Git hook manager (see hk.pkl). MUST stay pinned here: hk registers itself as
# `hk run pre-commit --from-hook` via git config, and an unpinned mise shim
# fails inside the hook with `mise ERROR No version is set for shim: hk`.
# The hook exits non-zero, git aborts the commit, and every later hook
# (post-commit -> `crew sync`, pre-push -> crew-state push) silently never runs.
hk = "1.55.0"
# Linters invoked by hk. Same pinning rule applies -- an unpinned shim here
# fails the step rather than the whole commit, but still breaks the hook.
# actionlint shells out to `shellcheck` for `run:` blocks, so it hard-fails
# with a `fatal error` if shellcheck is on PATH as an unpinned shim.
actionlint = "1.7.12"
shellcheck = "0.11.0"
"pipx:yamllint" = "1.38.0"
# Resolves the ref+ references in [env] below, via the vals-run task.
# Keep the version in step with home-operations, whose stacks render the same
# references in rendered config.
vals = "0.45.0"
sops = "3.13.3"
flux2 = "2.9.4"
age = "1.3.2"
cilium-cli = "0.19.7"
cloudflared = "2026.8.2"
cue = "0.17.1"
gh = "2.97.0"
"aqua:brumhard/krewfile" = "0.7.0"
"github:home-operations/flate" = "v0.5.1"
"github:microsoft/apm" = { version = "v0.28.0", bin = "apm" }
"github:eljulians/skillfile" = { version = "v1.9.1", bin = "skillfile" }
dotnet = { version = "10.0.203" }

[tasks.update]
description = 'Update all apps that have an update script'
run = [
  'dotnet run .mise/tasks/do-update.cs',
  'mise task flate',
]

[tasks.flate]
description = 'Run flate'
run = [
  'flate test all --allow-missing-secrets --source-retry-attempts 10',
]

[settings]
experimental = true
prereleases = true
idiomatic_version_file_enable_tools = ["dotnet"]

[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
BOOTSTRAP_DIR = "{{config_root}}/bootstrap"
KUBERNETES_DIR = "{{config_root}}/kubernetes"
ROOT_DIR = "{{config_root}}"
SCRIPTS_DIR = "{{config_root}}/scripts"
TALOS_DIR = "{{config_root}}/talos"
CONNECT_HOST = "https://op-connect.equestria.driscoll.tech/"
CONNECT_VAULT = "Eris"
CONNECT_TOKEN = "ref+openbao://secrets/shared/eris-1password-connect-access-token#/credential"
TAILSCALE_CLIENT_ID = "ref+openbao://secrets/shared/tailscale-terraform-oauth-client#/username"
TAILSCALE_CLIENT_SECRET = "ref+openbao://secrets/shared/tailscale-terraform-oauth-client#/credential"
UNIFI_HOST = "unifi.driscoll.tech"
UNIFI_USERNAME = "ref+openbao://secrets/shared/unifipoller#/username"
UNIFI_PASSWORD = "ref+openbao://secrets/shared/unifipoller#/password"
UNIFI_API_KEY = "ref+openbao://secrets/shared/unifi-api-key-eris-cluster#/credential"
UNIFI_PORT = "443"
UNIFI_SITE = "default"
UNIFI_VERIFY_SSL = "false"
UNIFI_TOOL_REGISTRATION_MODE = "lazy"
HK_MISE = 1
# Keep npm's download cache inside the mise data dir so jdx/mise-action's
# cache (which caches MISE_DATA_DIR / ~/.local/share/mise) also persists npm
# tarballs across CI runs. `npm ci` still wipes node_modules, but reuses these.
npm_config_cache = "{{env.HOME}}/.local/share/mise/npm-cache"

[hooks]
postinstall = ["hk install --mise"]

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app authentik
  namespace: &namespace sgc
  labels:
    app.kubernetes.io/name: *app
    driscoll.dev/name: *app
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      driscoll.dev/name: *app
  dependsOn:
    - name: volsync
      namespace: volsync-system
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  path: ./kubernetes/apps/sgc/idp/authentik
  prune: true
  wait: true
  force: false
  interval: 1h
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  components:
    - ../../../../components/failover/fast-node-eviction
    - ../../../../components/volsync
    - ../../../../components/postgres
    # CUTOVER: components/tailscale removed on purpose. It rendered
    # authentik-tailscale-ingress, which is what advertised the tailnet VIP
    # svc:authentik from the sgc-out ProxyGroup (machine sgc-out-0, tag:ingress).
    #
    # That name is NOT one of the three public vanity aliases and did not move
    # with them: DockgeLxc.ts:700 hands `remote: true` hosts
    # authentik.${TAILSCALE_DOMAIN} as their CLUSTER_AUTHENTIK_DOMAIN, and skystar
    # is such a host. alpha-site already registered itself as a second backing
    # host for the VIP, but home-operations cannot own the Service object while
    # this ingress still holds it — the create becomes an update and fails with
    # "addrs must contain 2 elements". Releasing here lets that create succeed.
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      VOLSYNC_ACCESSMODES: ReadWriteMany

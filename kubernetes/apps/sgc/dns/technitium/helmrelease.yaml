---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app technitium
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          annotations:
            k8s.v1.cni.cncf.io/networks: technitium-dns-net
        containers:
          *app :
            image:
              repository: technitium/dns-server
              tag: 15.4.0@sha256:df7d90ef0f7b6fff6916d291a7022cd902290cc31c3141d4158b6c375a641b41
            env:
              # First-start only (ignored once /etc/dns config exists) — kept in
              # lockstep with docker/_common/technitium/.env in home-operations.
              # After the node joins the Technitium cluster, cluster sync owns
              # most of these settings.
              DNS_SERVER_DOMAIN: dns.${ROOT_DOMAIN}
              DNS_SERVER_WEB_SERVICE_ENABLE_HTTPS: "true"
              DNS_SERVER_WEB_SERVICE_USE_SELF_SIGNED_CERT: "true"
              DNS_SERVER_RECURSION: AllowOnlyForPrivateNetworks
              DNS_SERVER_FORWARDERS: "9.9.9.9, 149.112.112.112"
              DNS_SERVER_FORWARDER_PROTOCOL: Tls
              DNS_SERVER_PREFER_IPV6: "false"
              DNS_SERVER_ENABLE_BLOCKING: "true"
              DNS_SERVER_ALLOW_TXT_BLOCKING_REPORT: "false"
              DNS_SERVER_LOG_USING_LOCAL_TIME: "true"
              DNS_SERVER_STATS_ENABLE_IN_MEMORY_STATS: "true"
              DNS_SERVER_OPTIONAL_PROTOCOL_DNS_OVER_HTTP: "true"
              DNS_SERVER_SSO_ENABLED: "true"
              DNS_SERVER_SSO_ALLOW_SIGNUP: "true"
              DNS_SERVER_SSO_ALLOW_SIGNUP_ONLY_FOR_MAPPED_USERS: "true"
              DNS_SERVER_SSO_GROUP_MAP: "admins:Administrators"
              DNS_SERVER_SSO_SCOPES: "openid,profile,email"
            envFrom:
              - secretRef:
                  name: ${APP}-env
            probes:
              # exec probes on purpose: kubelet-dialed tcpSocket probes source
              # from the node's LAN IP (10.10.0.0/16), and the pod replies via
              # the ipvlan net1 interface (asymmetric) — they always time out.
              # Exec runs inside the pod and is immune to the extra interface.
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5380"]
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5380"]
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: true
              readOnlyRootFilesystem: false
              capabilities:
                add:
                  - NET_BIND_SERVICE
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 512Mi

    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault

    service:
      # LAN DNS traffic arrives directly on the ipvlan interface (see nad).
      admin:
        controller: *app
        ports:
          admin:
            port: 5380
            protocol: TCP
          cluster-https:
            port: 53443
            protocol: TCP
      # Dedicated per-service tailscale proxy (NOT a ProxyGroup/Tailscale
      # Service — those cannot forward UDP today). Defined here rather than as
      # a raw manifest so kustomize commonLabels cannot rewrite the selector.
      # The device joins the tailnet as dns-<cluster> with tag:dns.
      tailscale:
        controller: *app
        type: LoadBalancer
        loadBalancerClass: tailscale
        annotations:
          tailscale.com/hostname: dns-${CLUSTER_CNAME}
          tailscale.com/tags: tag:dns
        ports:
          dns-udp:
            port: 53
            protocol: UDP
          dns-tcp:
            port: 53
            protocol: TCP
          dot:
            port: 853
            protocol: TCP
          doq:
            port: 853
            protocol: UDP
          doh:
            port: 443
            protocol: TCP
          admin-tls:
            port: 53443
            protocol: TCP

    persistence:
      config:
        existingClaim: ${APP}
        globalMounts:
          - path: /etc/dns

    route:
      admin:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - ${APP}.${CLUSTER_DOMAIN}
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: admin
                port: admin

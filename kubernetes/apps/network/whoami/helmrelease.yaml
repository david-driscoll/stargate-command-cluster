---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app traefik-whoami
  namespace: network
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  timeout: 10m
  interval: 1h
  driftDetection:
    mode: enabled
  values:
    controllers:
      *app :
        strategy: RollingUpdate
        replicas: 1
        pod:
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: *app
                    app.kubernetes.io/component: *app
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: ghcr.io/traefik/whoami
              tag: v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44

            resources:
              requests:
                cpu: 20m
                memory: 80M
              limits:
                memory: 80M

    service:
      main:
        controller: *app
        ports:
          http:
            port: &httpPort 80

    route:
      internal:
        parentRefs:
          - name: internal
            namespace: network
            kind: Gateway
        hostnames:
          - "whoami.${CLUSTER_DOMAIN}"
        kind: HTTPRoute
        rules:
          - backendRefs:
              - identifier: main
                port: *httpPort
            filters:
              # Stage 3 of docs/crowdsec-enforcement-rollout.md. Listed FIRST so
              # a ban returns 403 before the Authentik outpost redirect, which
              # makes `cscli decisions add` -> 403 a clean, unambiguous test.
              #
              # With the plugin's `enabled: false` this is a pass-through, so
              # attaching it here enforces nothing. It is deliberately the first
              # route to reference the middleware: the plugin validates its
              # config (including reading crowdsecLapiKeyFile) even when
              # disabled, so if the bouncer key is missing or unreadable this
              # ONE route breaks loudly and everything else is untouched.
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: crowdsec-bouncer
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authenticated-user

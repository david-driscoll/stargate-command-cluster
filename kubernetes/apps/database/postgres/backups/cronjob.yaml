# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app postgres-backup
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn:
    - name: postgres
      namespace: database
    - name: external-secrets
      namespace: kube-system
  values:
    # Reads the per-database credential Secrets in this namespace directly.
    # `get` only, and only in this namespace: the CronJob never lists Secrets,
    # so a Role beats a ClusterRole and a name-scoped read beats a wildcard.
    serviceAccount:
      *app : {}

    rbac:
      roles:
        *app :
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["secrets"]
              verbs: ["get"]
      bindings:
        *app :
          type: RoleBinding
          roleRef:
            identifier: *app
          subjects:
            - identifier: *app

    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        cronjob:
          backoffLimit: 6
          concurrencyPolicy: Forbid
          failedJobsHistory: 3
          schedule: "0 2 * * *"  # Daily at 2 AM
          startingDeadlineSeconds: 30
          successfulJobsHistory: 3
          suspend: false
        type: cronjob
        pod:
          automountServiceAccountToken: true
        serviceAccount:
          identifier: *app
        containers:
          main:
            image:
              repository: mcr.microsoft.com/dotnet/sdk
              tag: '10.0-noble@sha256:e1fc6e423f543119c406d24e2e687d67c569f18f04a37a8b0005d80ad0dcee80'
              pullPolicy: IfNotPresent
            env:
              # Explicit in the manifest rather than inferred from the
              # service-account token dir, so the namespace the credentials are
              # read from is visible where the RBAC that permits it is.
              POD_NAMESPACE:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              # Databases still in postgres whose application has been removed;
              # see the equestria copy for the rationale. SGC has none today.
              DECOMMISSIONED_DATABASES: ""
            command:
              - /bin/sh
              - -c
              - >-
                set -eux;
                export DEBIAN_FRONTEND=noninteractive;
                apt-get update
                && apt install -y postgresql-common
                && /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
                && apt-get install -y --no-install-recommends postgresql-client-17
                && dotnet run /scripts/App.cs
            resources:
              requests:
                memory: 256Mi
                cpu: 20m
              limits:
                memory: 512Mi
                cpu: 500m

    # defaultPodOptions:
    #   securityContext:
    #     runAsUser: 999
    #     runAsGroup: 999
    #     fsGroup: 999
    #     runAsNonRoot: true
    #     fsGroupChangePolicy: "OnRootMismatch"
    #     seccompProfile:
    #       type: RuntimeDefault

    persistence:
      script:
        type: configMap
        name: postgres-backup-script
        defaultMode: 493
        globalMounts:
          - path: /scripts/App.cs
            subPath: App.cs
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /.dotnet
            subPath: dotnet
      backups:
        type: nfs
        server: ${SPIKE_IP}
        path: /mnt/stash/data/pgdump

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app tsiam
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  interval: 1h
  timeout: 10m
  install:
    createNamespace: true
    replace: true
    remediation:
      retries: 7
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 7
      strategy: rollback
  rollback:
    force: false
    cleanupOnFail: true
    recreate: true
  uninstall:
    keepHistory: false
  dependsOn: []
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        strategy: Recreate
        pod:
          restartPolicy: Always
          terminationGracePeriodSeconds: 30
        containers:
          *app :
            nameOverride: *app
            image:
              repository: ghcr.io/italypaleale/tsiam
              tag: v0.2.1@sha256:bb1959e85ce1fd7b5007589a3f23711cac2b9b46c852eef2c4d159de9c9bef94
            env:
              # tsiam has no env-var config surface of its own; everything lives in
              # /etc/tsiam/config.yaml. TS_AUTHKEY is read by the embedded tsnet
              # library itself (tailscale.com/tsnet), the same way tsidp consumes it.
              TS_AUTHKEY:
                valueFrom:
                  secretKeyRef:
                    name: tailscale-authkey
                    key: authkey
            # tsiam serves *only* on its tsnet listener (:443 on the tailnet).
            # There is no cluster-local port, so /healthz is unreachable from the
            # kubelet and every probe type would be a false negative.
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

    defaultPodOptions:
      securityContext:
        # distroless/static-debian12:nonroot
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup is load-bearing, not decoration: it is what makes the PVC root
        # group-writable + setgid (0:65532 mode 2775) so tsiam can create and own
        # its own subdirectories under /var/lib/tsiam. It cannot make tsiam own
        # the root itself -- fsGroup never changes uid. See signingKey.file below.
        fsGroup: 65532
        # OnRootMismatch, not Always: the walk is group-only either way, so Always
        # buys nothing here and just re-chowns the tree on every mount.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    configMaps:
      config:
        enabled: true
        data:
          config.yaml: |
            tsnet:
              hostname: tsiam
              # tsnet's own node state (node key, machine key). Must be writable and
              # must survive restarts, otherwise the node re-registers on every boot.
              stateDir: /var/lib/tsiam/tsnet
              ephemeral: false
              # NOTE: no advertiseTags. The shared `tailscale-authkey` Secret is a
              # pre-tagged key (tag:apps, same key `idp` uses); tsnet cannot advertise
              # tags that the auth key does not already own. See the PR for the
              # dedicated `tag:tsiam` key follow-up.
              #
              # Funnel stays OFF: this estate has no public ingress at all (no 80/443
              # forward on the gateway) and nothing currently needs to verify these
              # tokens from outside the tailnet. Turning it on would be a brand new
              # public exposure surface.
              funnel: false

            tokens:
              lifetime: 5m
              # REQUIRED and must be non-empty -- tsiam refuses to start otherwise.
              # This is a deliberate placeholder (RFC 2606 reserved TLD, can never
              # resolve to anything real). Replace it with the real audience(s) when
              # an actual consumer exists.
              #
              # Nothing can obtain a token today regardless of this list: with
              # allowEmptyNodeCapability=false and no `italypaleale.me/tsiam` grants
              # in the tailnet policy, every /token request is rejected.
              allowedAudiences:
                - "https://placeholder.invalid"
              allowEmptyNodeCapability: false
              rateLimitPerMinute: 60
              # Stable Tailscale node ID. Never "name": node names are reusable once a
              # device is deleted, so a relying party keyed on a name can be silently
              # re-targeted by the next device that claims it.
              subjectClaim: nodeId

            signingKey:
              # "file", not "memory": in-memory keys are regenerated on every restart,
              # which rotates the JWKS and breaks every verifier (and every cached
              # JWKS at a relying party) on each pod reschedule. Not "AzureKeyVault*"
              # either -- the estate has no Azure footprint to anchor that to.
              storage: file
              algorithm: ES256
              file:
                # A SUBDIRECTORY, never the volume mount root. tsiam's
                # NewFileKeyStorage (pkg/keystorage/keystorage-file.go) does
                # MkdirAll(dir, 0700) followed by an *unconditional* Chmod(dir, 0700)
                # on filepath.Dir(storagePath), on every single start.
                #
                # chmod(2) requires the caller to own the file or hold CAP_FOWNER, and
                # it enforces that before it compares modes -- so it fails even when
                # the mode is already correct. This container drops ALL capabilities,
                # so it must own the directory outright.
                #
                # It cannot own the mount root. fsGroup only ever chowns the *group*
                # (kubelet calls chown(path, -1, fsGroup) and adds g+rwX plus setgid),
                # so a freshly provisioned Longhorn volume roots at
                # `0:65532 mode 2775` and stays uid 0 forever. Pointing storagePath at
                # the root made tsiam chmod / that root and crash-loop on
                # "chmod /var/lib/tsiam: operation not permitted" (see sgc#1739
                # follow-up). fsGroupChangePolicy: Always does NOT help -- it re-runs
                # the same group-only walk; verified against the live volume.
                #
                # Under a subdirectory it works without touching the security context:
                # the root is 2775 and group-writable by fsGroup 65532, so tsiam
                # creates `keys/` itself and therefore owns it, and the setgid bit
                # carries gid 65532 down. This also survives a VolSync restore: the
                # restic mover runs as VOLSYNC_PUID/PGID 65532, so a restored
                # `keys/` comes back owned by 65532 too, while the mount root is
                # re-created as uid 0 by the filesystem every time regardless.
                #
                # tsnet.stateDir above is a subdirectory for the same reason.
                storagePath: /var/lib/tsiam/keys/signing-key.json

            logs:
              level: info
              json: true
              omitHealthChecks: true

    persistence:
      # Signing key + tsnet node state. Backed up by VolSync (see ks.yaml) so the
      # JWKS survives loss of the PVC.
      data:
        existingClaim: *app
        globalMounts:
          - path: /var/lib/tsiam
      config:
        type: configMap
        # `identifier`, not `name`: the chart renders this ConfigMap as `tsiam`,
        # not `tsiam-config`, and identifier resolution keeps the reference correct
        # if that naming ever changes.
        identifier: config
        globalMounts:
          - path: /etc/tsiam/config.yaml
            subPath: config.yaml
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp

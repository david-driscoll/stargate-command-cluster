---
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-env
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshPolicy: Periodic
  refreshInterval: 4m
  target:
    name: ${APP}-env
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      metadata:
        annotations:
          reloader.stakater.com/auto: "true"
      data:
        TZ: "${TIMEZONE}"
        CONFIG_UI_TIME_ZONE: "${TIMEZONE}"

        # ---- LAPI connection -----------------------------------------
        # Watcher machine, registered by the init container in helmrelease.yaml
        # against the LAPI's auto_registration endpoint. An explicit named
        # machine with a known credential is easier to rotate and to audit than
        # a shared registration token, and it shows up in `cscli machines list`.
        CONFIG_INSTANCE_NAME: "${CLUSTER_TITLE}"
        CONFIG_INSTANCE_LAPI_URL: "http://crowdsec-service.network.svc.cluster.local:8080"
        CONFIG_INSTANCE_LAPI_AUTH_TYPE: "password"
        CONFIG_INSTANCE_LAPI_AUTH_USERNAME: "crowdsec-web-ui"
        CONFIG_INSTANCE_LAPI_AUTH_PASSWORD: "{{ .webui_password }}"

        # ---- Authentication ------------------------------------------
        # MUST be set explicitly. The default is `auto`, which only enables
        # authentication for NEW databases -- upstream warns that installations
        # migrated from releases that predate authentication stay
        # unauthenticated until this is turned on. Getting it wrong yields an
        # unauthenticated security console that can issue and revoke bans.
        CONFIG_AUTH_ENABLED: "true"
        CONFIG_AUTH_OIDC_ISSUER_URL: "{{ .oidc_issuer }}"
        CONFIG_AUTH_OIDC_CLIENT_ID: "{{ .oidc_client_id }}"
        CONFIG_AUTH_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        CONFIG_AUTH_OIDC_SCOPE: "openid profile email"
        CONFIG_AUTH_OIDC_GROUPS_CLAIM: "groups"
        CONFIG_AUTH_OIDC_ADMIN_GROUPS_0: "admins"
        # Anyone Authentik lets through who is not in `admins` gets nothing.
        # Upstream's default is already `deny`; pinned explicitly because the
        # cost of that default ever changing is an outsider with ban controls.
        CONFIG_AUTH_OIDC_UNMATCHED_ROLE: "deny"
        # `auth.sessionSecret` is deliberately NOT supplied: the app generates
        # and stores one in /app/data, which is a volsync-backed PVC.
  dataFrom:
    # The UI's LAPI password lives on its OWN 1Password item, 'Crowdsec UI'
    # (vault Eris), in a field named `password`. It is NOT `webui_password` on
    # the shared 'Crowdsec ApiKey' item -- that field was never created and
    # nothing reads it. 'Crowdsec ApiKey' is not extracted here at all: this
    # ExternalSecret consumed exactly one key from it, so with the password
    # moved there is nothing left to read, and an extract nobody consumes is
    # only a way to fail.
    #
    # BOTH sources are prefixed, so no bare key enters the template namespace.
    # That is deliberate. ESO merges every `dataFrom` entry into ONE flat map
    # before templating, later entries overwriting earlier ones with no
    # warning, and `password` (like `username`, which a 1Password login item
    # also returns) is generic enough that a third source would eventually
    # collide with it. Prefixing makes that impossible by construction rather
    # than by everyone remembering. This is the one place the crowdsec app's
    # "the 1Password field name IS the template key name" rule is not followed,
    # and it costs nothing here: unlike `apikey_bouncer`, this value is never
    # mounted as a file, so there is no third side of the contract to keep in
    # sync -- the consuming env var name is fixed by upstream regardless.
    #
    # The rewrite is the two-step normalise-then-prefix form, identical to the
    # crowdsec app's postgres block. It is NOT the single-step
    # `source: "[\W]", target: "<prefix>_"` form this branch deleted from
    # crowdsec/externalsecret.yaml: regexp rewrites are ReplaceAllString over
    # the key, so a character class that matches no character in the key
    # rewrites nothing at all and silently yields a key that never existed.
    # Verified against Go's regexp: step 1 leaves `password` alone (no
    # non-word characters), step 2 turns it into `webui_password`.
    - extract:
        key: 'Crowdsec UI'
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "webui_$1"
    - extract:
        key: '${APP}-oidc-credentials'
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          # `network`, NOT `cluster`. These stores are all the kubernetes
          # provider pointed at a FIXED remoteNamespace (see
          # kubernetes/apps/kube-system/external-secrets/stores/kubernetes.yaml):
          # `cluster` reads from the equestria namespace, `network` from the
          # network namespace. The oidc-credentials Secret is written into the
          # app's OWN namespace, which for this app is network -- so `cluster`
          # resolved it to equestria, where it does not exist, and the WHOLE
          # ExternalSecret failed: "error processing spec.dataFrom[1].extract,
          # err: Secret does not exist". No -env Secret was created at all, so
          # the envFrom in helmrelease.yaml would have left the pod in
          # CreateContainerConfigError even once its PVC binds.
          # Every existing user of `cluster` is an app in the equestria
          # namespace, where store name and app namespace coincide; this is the
          # first app outside it to take this path, which is why the mismatch
          # had not surfaced before.
          name: network
      rewrite:
        - regexp:
            source: "[\\W]"
            target: _
        - regexp:
            source: "(.*)"
            target: "oidc_$1"
